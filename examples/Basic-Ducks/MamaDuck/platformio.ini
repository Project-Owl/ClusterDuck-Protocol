board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_deps = 
	${env:esp32.lib_deps}
	${env:release_cdp.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@2.0.1

