; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = local_heltec_wifi_lora_32_V3
description = MamaDuck CDP examples

[env]
lib_deps = 
	WIRE
	SPI
	contrem/arduino-timer@^3.0.1
	bblanchon/ArduinoJson@^7.0.3

[env:esp32]
lib_deps = heltecautomation/Heltec ESP32 Dev-Boards@2.0.1

[env:local_cdp]
lib_deps = 
	symlink://../../../
	heltecautomation/Heltec ESP32 Dev-Boards@2.0.1

[env:release_cdp]
lib_deps = 
	symlink://../../../
	heltecautomation/Heltec ESP32 Dev-Boards@2.0.1

[env:prod_heltec_wifi_lora_32_V2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
monitor_filters = time
lib_deps = 
	${env:esp32.lib_deps}
	${env:release_cdp.lib_deps}
	heltecautomation/Heltec ESP32 Dev-Boards@2.0.1

[env:prod_heltec_wifi_lora_32_V3]
